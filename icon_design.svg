<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm wood background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A96A"/>
      <stop offset="100%" stop-color="#B5793A"/>
    </linearGradient>
    <!-- Black piece radial gradient for 3D look -->
    <radialGradient id="blackPiece" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <!-- White piece radial gradient for 3D look -->
    <radialGradient id="whitePiece" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </radialGradient>
    <!-- Magnifier lens gradient -->
    <radialGradient id="lensGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#faf5ec" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8d9be" stop-opacity="0.92"/>
    </radialGradient>
    <!-- Clip path for magnifier: center (393,393) r=165, arc grazes both background pieces -->
    <clipPath id="lensClip">
      <circle cx="393" cy="393" r="165"/>
    </clipPath>
    <!-- Drop shadow filter for magnifier -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="7" flood-color="#00000055"/>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────── -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- ── Subtle wood grain diagonals ───────────────────── -->
  <line x1="0" y1="200" x2="200" y2="0" stroke="#C49050" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="0" y1="380" x2="380" y2="0" stroke="#C49050" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="130" y1="512" x2="512" y2="130" stroke="#C49050" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="310" y1="512" x2="512" y2="310" stroke="#C49050" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- ── Full-background board grid: 4 lines × 4 lines ─── -->
  <!-- Lines at 64, 192, 320, 448 — spanning the full 512×512 canvas -->
  <!-- Horizontal lines -->
  <line x1="0"   y1="64"  x2="512" y2="64"  stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <line x1="0"   y1="192" x2="512" y2="192" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <line x1="0"   y1="320" x2="512" y2="320" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <line x1="0"   y1="448" x2="512" y2="448" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <!-- Vertical lines -->
  <line x1="64"  y1="0"   x2="64"  y2="512" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <line x1="192" y1="0"   x2="192" y2="512" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <line x1="320" y1="0"   x2="320" y2="512" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>
  <line x1="448" y1="0"   x2="448" y2="512" stroke="#5C3D1A" stroke-width="3.5" stroke-opacity="0.75"/>

  <!-- ── Star points (hoshi) at 4 inner intersections ─── -->
  <circle cx="192" cy="192" r="7" fill="#5C3D1A" fill-opacity="0.60"/>
  <circle cx="320" cy="192" r="7" fill="#5C3D1A" fill-opacity="0.60"/>
  <circle cx="192" cy="320" r="7" fill="#5C3D1A" fill-opacity="0.60"/>
  <circle cx="320" cy="320" r="7" fill="#5C3D1A" fill-opacity="0.60"/>

  <!-- ── Black piece at (192, 320) ── -->
  <circle cx="192" cy="320" r="46" fill="url(#blackPiece)"/>
  <ellipse cx="178" cy="306" rx="13" ry="9" fill="white" fill-opacity="0.28"/>

  <!-- ── White piece at (320, 192) ── -->
  <circle cx="320" cy="192" r="46" fill="url(#whitePiece)"/>
  <circle cx="320" cy="192" r="46" fill="none" stroke="#999898" stroke-width="2" stroke-opacity="0.5"/>
  <ellipse cx="306" cy="178" rx="13" ry="9" fill="white" fill-opacity="0.75"/>

  <!-- ── Magnifier (bottom-right, partially canvas-clipped) ── -->
  <!-- Center (393,393) r=165: left/top arc grazes background pieces at (192,320) and (320,192) by ~3px -->
  <!-- Shadow halo -->
  <circle cx="393" cy="393" r="172" fill="#00000038" filter="url(#shadow)"/>
  <!-- Lens glass -->
  <circle cx="393" cy="393" r="165" fill="url(#lensGrad)"/>

  <!-- Zoomed content inside lens ─ clipped to lens circle -->
  <g clip-path="url(#lensClip)">
    <!-- Board tint (semi-transparent warm overlay distinguishes lens area) -->
    <rect x="225" y="225" width="350" height="350" fill="#D4A96A" fill-opacity="0.58"/>
    <!-- Grid lines: match actual background grid at x=320, x=448, y=320, y=448 -->
    <line x1="225" y1="320" x2="565" y2="320" stroke="#5C3D1A" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="225" y1="448" x2="565" y2="448" stroke="#5C3D1A" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="320" y1="225" x2="320" y2="565" stroke="#5C3D1A" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="448" y1="225" x2="448" y2="565" stroke="#5C3D1A" stroke-width="5" stroke-opacity="0.75"/>
    <!-- Hoshi dots at the two empty intersections -->
    <circle cx="448" cy="320" r="8" fill="#5C3D1A" fill-opacity="0.55"/>
    <circle cx="320" cy="448" r="8" fill="#5C3D1A" fill-opacity="0.55"/>
    <!-- Black piece at top-left intersection (320, 320) -->
    <circle cx="320" cy="320" r="40" fill="url(#blackPiece)"/>
    <ellipse cx="307" cy="307" rx="13" ry="9" fill="white" fill-opacity="0.28"/>
    <!-- White piece at bottom-right intersection (448, 448) — fully on canvas (448+40=488<512) -->
    <circle cx="448" cy="448" r="40" fill="url(#whitePiece)"/>
    <circle cx="448" cy="448" r="40" fill="none" stroke="#999898" stroke-width="2" stroke-opacity="0.5"/>
    <ellipse cx="435" cy="435" rx="13" ry="9" fill="white" fill-opacity="0.75"/>
  </g>

  <!-- Lens rim -->
  <circle cx="393" cy="393" r="165" fill="none" stroke="#8B6914" stroke-width="9"/>
  <!-- Inner lens sheen -->
  <circle cx="393" cy="393" r="163" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.35"/>
</svg>

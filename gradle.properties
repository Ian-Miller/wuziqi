# AndroidX migration
android.useAndroidX=true
# Disable Jetifier if not needed (AndroidX dependencies are already migrated)
android.enableJetifier=false

# Suppress warning for compileSdk 36 with AGP 8.4.0
# android.suppressUnsupportedCompileSdk=36

# Kotlin configuration
kotlin.code.style=official
kapt.use.worker.api=false
kapt.include.compile.classpath=false
kapt.use.java.home=false
kapt.verbose=false
kapt.use.kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Parallel build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# JVM memory
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
# android.newDsl=false
# Kotlin compiler strategy: use daemon for better memory management
kotlin.compiler.execution.strategy=daemon

# KSP memory
ksp.incremental=false
ksp.incremental.log=false